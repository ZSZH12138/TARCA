[project]
name = "tarca"
version = "0.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "torch>=2.6,<3",
  "POT>=0.9.5,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "psutil>=6,<8",
]

[project.optional-dependencies]
research = [
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "statsmodels>=0.14,<1",
  "pyvene>=0.1.8,<1",
  "hydra-core>=1.3,<2",
  "omegaconf>=2.3,<3",
  "pyarrow>=19,<25",
  "h5py>=3.12,<4",
  "zarr>=3,<4",
  "matplotlib>=3.9,<4",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "pre-commit>=4,<5",
  "ruff>=0.12,<1",
  "uv>=0.11.15,<0.12",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
source = ["tarca.stage0", "tarca.contracts", "tarca.data.synthetic"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "scripts", "tests", "third_party_manifest"]
extend-exclude = [".cache", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/test_operator_docs.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

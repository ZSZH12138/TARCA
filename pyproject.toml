[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tarca"
version = "0.0.0"
description = "Temporal causal abstraction research contracts and Stage 0 governance tooling"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.12,<3",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
research = [
  "numpy>=1.26,<3",
  "pot==0.9.7",
  "pyarrow>=25,<26",
  "pyvene==0.1.8",
  "torch==2.13.0",
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pre-commit>=4.3,<5",
  "pytest>=9.0,<10",
  "pytest-cov>=7.0,<8",
  "ruff>=0.15,<0.16",
  "types-PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tarca"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["tarca"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tarca"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

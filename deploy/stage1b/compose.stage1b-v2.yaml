services:
  stage1b:
    image: tarca-stage1b-v2:local
    build:
      context: ../..
      dockerfile: deploy/stage1b/Dockerfile
    init: true
    read_only: true
    shm_size: "16gb"
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      TARCA_STAGE1B_SOURCE_CACHE_ROOT: /opt/tarca/official_sources
      TARCA_STAGE1B_SOURCE_MODE: offline-capsule
      TARCA_STAGE1B_ARTIFACT_ROOT: /opt/tarca/artifacts/stage1b/confirmation-r2
      TARCA_STAGE1B_QUALIFICATION_CONFIG: /opt/tarca/configs/stage1b/qualification_v2_confirmation_r2.yaml
      TARCA_STAGE1B_DATABASE: /opt/tarca/artifacts/stage1b/confirmation-r2/runtime/execution.sqlite3
      TARCA_STAGE1B_STATIC_ROOT: /opt/tarca/frontend/stage1b-monitor/dist
      TARCA_STAGE1B_DEVICE: cuda
      TARCA_STAGE1B_DATALOADER_WORKERS: "3"
    tmpfs:
      - /tmp:size=4g,mode=1777
    volumes:
      - type: bind
        source: ${TARCA_STAGE1B_ARTIFACT_DIR:-../../artifacts/stage1b-server}
        target: /opt/tarca/artifacts/stage1b
      - type: volume
        source: stage1b-sources
        target: /opt/tarca/official_sources
        read_only: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  stage1b-source-import:
    image: tarca-stage1b-v2:local
    build:
      context: ../..
      dockerfile: deploy/stage1b/Dockerfile
    entrypoint:
      - python
      - scripts/import_stage1b_source_capsule.py
      - --cache-root
      - /opt/tarca/official_sources
    read_only: true
    environment:
      TARCA_STAGE1B_SOURCE_CACHE_ROOT: /opt/tarca/official_sources
    tmpfs:
      - /tmp:size=1g,mode=1777
    volumes:
      - type: volume
        source: stage1b-sources
        target: /opt/tarca/official_sources
        read_only: false
      - type: bind
        source: ${TARCA_STAGE1B_SOURCE_TRANSFER_DIR:-./artifacts/stage1b/source-capsules}
        target: /opt/tarca/source-transfer
        read_only: true

volumes:
  stage1b-sources:
    name: tarca-stage1b-v2-sources

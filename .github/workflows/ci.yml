name: stage0-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  stage0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Restore frozen environment
        run: uv sync --frozen --extra research --group dev
      - name: Restore Stage1B runtime and test add-on
        run: uv pip install --python .venv/bin/python --require-hashes -r deploy/stage1b/requirements-test.lock
      - name: Lint
        run: uv run --frozen --no-sync ruff check .
      - name: Type check
        run: uv run --frozen --no-sync mypy
      - name: Test with coverage
        run: uv run --frozen --no-sync pytest --cov=tarca --cov-report=term-missing --cov-report=xml
      - name: Stage 0 offline gate
        run: uv run --frozen --no-sync python scripts/check_stage0.py --json
